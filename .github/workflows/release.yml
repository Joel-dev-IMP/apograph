name: Publish Alpha release

on:
  push:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install npm dependencies
        run: npm install

      - name: Package VS Code extension
        id: package
        uses: nhedger/package-vscode-extension@v1

      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=$(echo ${{github.sha}} | cut -c -7)" >> "$GITHUB_OUTPUT"

      - run: mv "${{steps.package.outputs.packagePath}}" "./apograph-${{ steps.short_sha.outputs.short_sha}}.vsix"

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "nightly" --repo "$GITHUB_REPOSITORY" --clobber \
            "apograph-${{ steps.short_sha.outputs.short_sha }}.vsix"
