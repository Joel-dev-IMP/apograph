name: Publish Alpha release

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=$(echo ${{github.sha}} | cut -c -7)" >> "$GITHUB_OUTPUT"

      - run: ls

      - run: gh release view "nightly" --repo "$GITHUB_REPOSITORY"

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "nightly" --repo "$GITHUB_REPOSITORY" --clobber \
            "CHANGELOG.md"
